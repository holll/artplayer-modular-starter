<!doctype html>
<html lang="zh-CN" style="color-scheme:dark">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070A12" />
  <title>ArtPlayer 多格式在线播放</title>
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./css/app.css" />
  <!-- 关键字体提前握手：否则要等 CSS 解析完才发现字体，swap 期间会先闪系统字体 -->
  <link rel="preload" href="./fonts/inter_5.2.6_latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <!-- 模块图预取：入口与它静态 import 的模块并行拉取，少一轮串行往返 -->
  <link rel="modulepreload" href="./js/main.js" />
  <link rel="modulepreload" href="./js/dom.js" />
  <link rel="modulepreload" href="./js/utils.js" />
  <link rel="modulepreload" href="./js/customTypes.js" />
  <link rel="modulepreload" href="./js/engines.js" />
  <link rel="modulepreload" href="./js/aspectRatio.js" />
  <link rel="modulepreload" href="./js/liveDetect.js" />
  <link rel="modulepreload" href="./js/mediaSession.js" />
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <h1>多格式在线播放</h1>
        <p>MP4 / HLS / FLV / DASH</p>
      </div>
      <div class="badge" id="statusBadge" aria-live="polite" aria-atomic="true">未加载</div>
    </header>

    <main class="layout" id="main-content">
      <section class="card player-card">
        <div class="player-title">
          <div class="section-title">播放器</div>
          <div class="badge" id="typeBadge">type: -</div>
        </div>
        <div class="player-shell">
          <div id="player"></div>
        </div>
        <div class="hint" id="hintLine" role="status" aria-live="polite">支持 MP4 / HLS / FLV / DASH 与移动端比例自适应</div>
      </section>

      <aside class="card ctrl-card">
        <div class="field">
          <div class="section-title">输入播放地址</div>
          <div class="row">
            <input id="urlInput" type="url" inputmode="url" enterkeyhint="go" placeholder="视频 URL…" aria-label="视频地址" autocomplete="url" name="videoUrl" />
            <button class="btn primary" id="playBtn">播放</button>
          </div>
          <div class="row">
            <button class="btn" id="stopBtn">停止</button>
            <button class="btn" id="pipBtn">画中画</button>
            <button class="btn" id="shotBtn">截图</button>
          </div>
        </div>
        <div class="field">
          <div class="section-title">示例</div>
          <div class="list" id="presetList"></div>
        </div>
      </aside>
    </main>
  </div>

  <!-- defer：解析不被 155 KB 的播放器内核阻塞，模块脚本在它之后按文档顺序执行 -->
  <script src="./js/vendors/artplayer.js" defer fetchpriority="high"></script>
  <!-- HLS / FLV / DASH 引擎由 js/engines.js 按需加载，首屏不再下载这 1.3 MB -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
